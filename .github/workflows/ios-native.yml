name: iOS native compile

on:
  pull_request:
    paths:
      - "modules/fortomnia-health/**"
      - "modules/fortomnia-watch/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-native.yml"
  push:
    branches:
      - "milestone/**"
    paths:
      - "modules/fortomnia-health/**"
      - "modules/fortomnia-watch/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-native.yml"

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile iOS simulator app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Compile without code signing
        run: >-
          xcodebuild
          -workspace ios/Fortomnia.xcworkspace
          -scheme Fortomnia
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
