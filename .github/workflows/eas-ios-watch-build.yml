# Trigger the signed iOS production build containing Watch and WidgetKit extensions.
name: EAS iOS Extensions Build

on:
  workflow_dispatch:
  push:
    branches:
      - milestone/15-health-wearables
    paths:
      - .github/workflows/eas-ios-watch-build.yml
      - app.json
      - modules/fortomnia-live-activity/**
      - modules/fortomnia-watch/**
      - targets/fortomnia-watch/**
      - targets/fortomnia-widgets/**
      - src/components/WidgetSnapshotSync.tsx
      - src/components/notification-response-handler.tsx
      - src/hooks/use-workout-live-activity.ts
      - src/hooks/useWatchWorkoutSync.ts
      - src/lib/notificationService.ts
      - src/lib/watchConnectivity.ts
      - src/lib/watchWorkoutContract.ts

concurrency:
  group: eas-ios-extensions-build
  cancel-in-progress: true

jobs:
  build:
    name: Submit iOS, Watch, and widgets build to EAS
    runs-on: ubuntu-latest
    steps:
      - name: Check out Fortomnia
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        run: eas whoami

      - name: Link Watch provisioning profile and start build
        env:
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: eas build --platform ios --profile production --non-interactive --no-wait
