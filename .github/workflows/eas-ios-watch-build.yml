name: EAS iOS Watch Build

on:
  workflow_dispatch:
  push:
    branches:
      - milestone/15-health-wearables
    paths:
      - .github/workflows/eas-ios-watch-build.yml

concurrency:
  group: eas-ios-watch-build
  cancel-in-progress: false

jobs:
  build:
    name: Submit iOS and Watch build to EAS
    runs-on: ubuntu-latest
    steps:
      - name: Check out Fortomnia
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        run: eas whoami

      - name: Start signed iOS production build
        run: eas build --platform ios --profile production --non-interactive --no-wait
