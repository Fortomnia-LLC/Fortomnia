name: EAS Android Preview Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-health-connect-incremental-sync
    paths:
      - .github/workflows/eas-android-preview-build.yml

concurrency:
  group: eas-android-preview-build
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android 1.0.1 APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Fortomnia
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        run: eas whoami

      - name: Start Android preview build
        run: eas build --platform android --profile android-preview --non-interactive --no-wait
# Rebuild after Android native compile passed.
