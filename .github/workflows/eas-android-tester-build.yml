name: EAS Android Tester Build

on:
  workflow_dispatch:
  push:
    branches:
      - milestone/15-health-wearables
    paths:
      - .github/workflows/eas-android-tester-build.yml

concurrency:
  group: eas-android-tester-build
  cancel-in-progress: true

jobs:
  build:
    name: Submit Android tester APK to EAS
    runs-on: ubuntu-latest
    steps:
      - name: Check out Fortomnia
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        run: eas whoami

      - name: Start Android tester build
        run: eas build --platform android --profile android-preview --non-interactive --no-wait
